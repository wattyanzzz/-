<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>暗黒の螺旋回廊 — テキストRPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e4d6;--panel:#f5f1e6;--ink:#23212a;--dim:#6b6759;--line:#c9c2ae;--accent:#2d4a7a;--hp:#a6323f;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12131c;--panel:#1b1d2b;--ink:#e7e2d0;--dim:#8c8a80;--line:#2f3245;--accent:#d2a94f;--hp:#d0606b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12131c;--panel:#1b1d2b;--ink:#e7e2d0;--dim:#8c8a80;--line:#2f3245;--accent:#d2a94f;--hp:#d0606b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;line-height:1.7}
#app{max-width:520px;margin:0 auto;padding:14px}
h1{font-size:26px;margin:4px 0 12px;letter-spacing:.2em}
.party{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pm{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 9px;font-size:14px;line-height:1.5}
.pm i{font-style:normal;color:var(--dim);font-size:12px;margin-left:4px}
.pm span{display:block;font-size:13px}
.pm.dead{opacity:.45}.pm.dead b{text-decoration:line-through}
.pm.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.gold{text-align:right;font-size:13px;color:var(--dim);margin:6px 2px}
.stage{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:10px}
.view{flex:1;font-size:17px}.view small{display:block;color:var(--dim);font-size:13px}
.view p{margin:0 0 6px}
.map{display:grid;grid-template-columns:repeat(11,13px);gap:1px}
.map i{display:block;width:13px;height:13px;font-style:normal;font-size:10px;line-height:13px;text-align:center}
.map .w{background:var(--line)}.map .f{background:var(--bg)}.map .p{color:var(--accent);font-weight:700;background:var(--bg)}
.log{min-height:112px;margin-bottom:10px;padding:0 2px}
.log p{margin:0 0 2px;font-size:14px;color:var(--dim)}.log p:last-child{color:var(--ink)}
button{font:inherit;font-size:16px;min-height:46px;padding:6px 12px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;cursor:pointer}
button:active{border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dpad,.row{display:grid;gap:6px;margin-bottom:6px}
.dpad{grid-template-columns:repeat(3,1fr)}.row{grid-template-columns:1fr 1fr}
.main{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}
.en{width:100%;text-align:left;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.en.dead{text-decoration:line-through}
.bar{display:inline-block;width:70px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar s{display:block;height:100%;background:var(--hp)}
.who{font-size:15px;margin:0 0 6px}
.foes{display:flex;justify-content:center;align-items:flex-end;gap:10px;min-height:120px;margin-bottom:10px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:4px}
.foes figure{margin:0;text-align:center;font-size:12px;color:var(--dim)}
.foes svg{display:block;width:96px;height:96px;margin:0 auto 2px}
.foes.boss svg{width:150px;height:150px}
.foes .gone{opacity:.15;filter:grayscale(1)}
@keyframes bob{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:no-preference){.foes figure:not(.gone) svg{animation:bob 1.1s steps(1) infinite}}
.g{display:flex;align-items:center;gap:6px;font-size:12px;line-height:1.5}.g em{font-style:normal;width:20px;color:var(--dim)}.g u{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}.g u s{display:block;height:100%;background:var(--hp)}.g.mp u s{background:#4f86c6}.g var{font-style:normal;min-width:48px;text-align:right}
input,select{font:inherit;font-size:16px;min-height:46px;min-width:0;padding:6px 10px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px}
@media (prefers-reduced-motion:no-preference){.pm{transition:border-color .2s}}
</style></head>
<body><div id="app"></div>
<script>
const SK='dungeon-save-v2';
const CL={戦士:[30,0,7],僧侶:[20,8,4],魔術師:[15,10,3],盗賊:[19,0,6]};
const EN=[{n:'スライム',hp:9,atk:4,xp:6,g:6},{n:'ゴブリン',hp:14,atk:6,xp:10,g:10},{n:'スケルトン',hp:20,atk:9,xp:16,g:16},{n:'オーク',hp:30,atk:12,xp:26,g:26},{n:'亡霊',hp:36,atk:15,xp:38,g:36},{n:'石像',hp:56,atk:18,xp:55,g:50},{n:'吸血鬼',hp:60,atk:21,xp:75,g:70},{n:'魔狼',hp:72,atk:24,xp:100,g:95},{n:'竜牙兵',hp:88,atk:27,xp:135,g:130},{n:'魔神',hp:105,atk:30,xp:180,g:180}];
const BOSS={n:'大魔導師ヴォルグ',hp:420,atk:32,xp:900,g:1000,boss:1};
const WEP=[{n:'鉄の剣',a:3,p:80},{n:'戦斧',a:5,p:160},{n:'鋼の剣',a:7,p:260},{n:'聖銀の剣',a:10,p:420},{n:'魔剣',a:13,p:640},{n:'竜殺しの剣',a:17,p:900}];
const ARM=[{n:'革の鎧',d:2,p:70},{n:'鎖帷子',d:4,p:150},{n:'鋼の鎧',d:6,p:250},{n:'聖銀の鎧',d:9,p:400},{n:'魔鎧',d:12,p:620},{n:'竜鱗の鎧',d:16,p:880}];
let MAP;
function gen(f){
  let s=f*7919+13+((G&&G.loop)||0)*104729+((G&&G.seed)||0);const r=()=>(s=s*16807%2147483647)/2147483647;
  const g=Array.from({length:11},()=>Array(11).fill('#')),st=[[1,1]];g[1][1]='.';
  while(st.length){
    const[x,y]=st[st.length-1];
    const n=[[2,0],[-2,0],[0,2],[0,-2]].filter(([a,b])=>x+a>0&&x+a<10&&y+b>0&&y+b<10&&g[y+b][x+a]==='#');
    if(!n.length){st.pop();continue}
    const[a,b]=n[Math.floor(r()*n.length)];g[y+b/2][x+a/2]='.';g[y+b][x+a]='.';st.push([x+a,y+b]);
  }
  const D={'1,1':0},q=[[1,1]];let far=[1,1];
  for(let i=0;i<q.length;i++){const[x,y]=q[i];far=[x,y];
    for(const[a,b]of DIRS){const k=(x+a)+','+(y+b);if(g[y+b][x+a]!=='#'&&!(k in D)){D[k]=1;q.push([x+a,y+b])}}}
  const de=[];
  for(let y=1;y<10;y+=2)for(let x=1;x<10;x+=2)
    if(DIRS.filter(([a,b])=>g[y+b][x+a]!=='#').length===1&&!(x===1&&y===1)&&!(x===far[0]&&y===far[1]))de.push([x,y]);
  for(let i=0;i<2&&de.length;i++){const[x,y]=de.splice(Math.floor(r()*de.length),1)[0];g[y][x]='T'}
  g[far[1]][far[0]]=f===10?'B':'D';g[1][1]='S';g.d=far;return g;
}
function newGame(){G={mode:'create',party:[],log:[],gold:0};render()}
function createView(){
  const df=['ガイウス','ミリア','ゼノン','リーゼ'],dc=['戦士','僧侶','魔術師','盗賊'];
  let sv='';try{sv=localStorage.getItem(SK)||''}catch(e){}
  document.getElementById('app').innerHTML='<h1>暗黒の螺旋回廊</h1><p>名前と職業を選んで、4人の冒険者を作ろう。</p>'
  +df.map((n,i)=>`<div class="row"><input id="n${i}" value="${n}" maxlength="6" aria-label="名前${i+1}"><select id="c${i}">${Object.keys(CL).map(c=>`<option value="${c}"${c===dc[i]?' selected':''}>${c}</option>`).join('')}</select></div>`).join('')
  +'<button class="main" style="width:100%;margin-bottom:6px" onclick="begin()">冒険を始める</button>'
  +(sv?'<button style="width:100%" onclick="loadGame()">続きから</button>':'');
}
function begin(){startGame([0,1,2,3].map(i=>{
  const c=document.getElementById('c'+i).value,[h,m,a]=CL[c];
  return mk((document.getElementById('n'+i).value||'名無し').replace(/[<>&"']/g,''),c,h,m,a)}))}
function save(){try{
  if(G.mode==='explore')localStorage.setItem(SK,JSON.stringify({...G,seen:[...G.seen],log:G.log.slice(-6)}));
  else if(G.mode==='win'){const s=loopState();s.seen=[];localStorage.setItem(SK,JSON.stringify(s))}
  else if(G.mode==='over')localStorage.removeItem(SK);
}catch(e){}}
function loadGame(){try{
  const s=JSON.parse(localStorage.getItem(SK));s.seen=new Set(s.seen);G=s;MAP=gen(G.F);G.menu=null;log('冒険を再開した。');render();
}catch(e){newGame()}}
const SP={
'スライム':[['#52b36b','#1f5c36','#b4ecc0','#111'],['......','......','....bb','..bbaa','.baaaa','.bacaa','baaeaa','baaeaa','baaaaa','baaaaa','.bbbbb','......']],
'ゴブリン':[['#6f9e3a','#2d4a14','#e8e0c0','#e33'],['......','..bbbb','b.baaa','bbaaaa','.baeaa','.baaaa','..bccc','..bbbb','.bbaaa','.baaaa','.baab.','.bb...']],
'スケルトン':[['#e8e4d4','#4a4a58','#9a9a9a','#111'],['......','..bbbb','.baaaa','.baaaa','.beeaa','.beeaa','..bbcc','...bba','.bccaa','..bbaa','.bccaa','..b.aa']],
'オーク':[['#7a8f4e','#2f3a1a','#f2f2e0','#f33'],['......','..bbbb','.baaaa','.baaaa','.beeaa','.baaaa','bcabbb','..bbbb','bbaaaa','baaaaa','.baaaa','.bb.bb']],
'亡霊':[['#d8dcf0','#7a80b0','#ffffff','#222'],['......','...bbb','..baaa','.baaaa','.baaaa','.baeea','.baeea','.baaaa','.baaaa','.baaaa','.ba.ba','.b..b.']],
'石像':[['#8c8f99','#3a3c44','#c4c7d0','#f5c542'],['b.....','bb..bb','.baaaa','.baeea','.baaaa','..bbcc','bbbaaa','bcbaaa','bcbaaa','.bbaaa','..baab','..bb.b']],
'吸血鬼':[['#e6dccb','#3a1230','#b3243a','#e22'],['......','..bbbb','.bbbbb','.baaaa','.baeea','.baaaa','..baca','..bbbb','bcbbbb','bcbbbb','bbbbbb','bb.bb.']],
'魔狼':[['#6b6f85','#25283a','#e8e8f0','#ffd23a'],['b.....','bb....','baaaaa','baaaaa','baeeaa','baaaaa','.baaaa','..bbaa','..bcab','..bbbb','......','......']],
'竜牙兵':[['#d9cfa5','#5a3a1e','#c0392b','#ff5a1f'],['b.....','bbbbbb','baaaaa','baeeaa','baeeaa','.baaaa','..bccc','..cbbb','bbbaaa','bcbaaa','bbb.aa','..bb..']],
'魔神':[['#b3263a','#4a0f1a','#f2c14e','#ffe066'],['c.....','cc....','.cbbbb','..baaa','..beea','..baaa','..bccc','..bbbb','bbaaaa','baaaaa','baa.aa','bb..bb']],
'大魔導師ヴォルグ':[['#d8c0a8','#3a2a78','#f0ece0','#ff4040'],['.....b','....bb','...bbb','..bbcb','bbbbbb','..baaa','..beea','..bccc','.bbccc','bbbbcc','bbbbbb','bbbbbb']]
};
function spr(n){
  const s=SP[n.split(' ')[0]];if(!s)return '';
  const p={a:s[0][0],b:s[0][1],c:s[0][2],e:s[0][3]};let r='';
  s[1].forEach((row,y)=>[...(row+[...row].reverse().join(''))].forEach((c,x)=>{if(c!=='.')r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${p[c]}"/>`}));
  return `<svg viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}
let AT,LT,SHOWN=0;
function typeLog(){
  const ps=[...document.querySelectorAll('.log p')],n=Math.min(ps.length,Math.max(0,G.log.length-SHOWN));
  SHOWN=G.log.length;clearInterval(LT);
  if(!n)return 0;
  const todo=ps.slice(ps.length-n),txt=todo.map(p=>p.textContent);
  todo.forEach(p=>p.textContent='\u00a0');
  let i=0,j=0;
  const done=()=>{clearInterval(LT);todo.forEach((p,k)=>p.textContent=txt[k])};
  LT=setInterval(()=>{
    if(i>=todo.length)return clearInterval(LT);
    todo[i].textContent=txt[i].slice(0,++j);
    if(j>=txt[i].length){i++;j=0}
  },18);
  document.querySelector('.log').onclick=done;
  return txt.reduce((s,t)=>s+t.length,0)*18;
}
const gb=(l,v,mx,c)=>`<div class="g ${c}"><em>${l}</em><u><s style="width:${mx?Math.max(0,v)/mx*100:0}%"></s></u><var>${mx?v+'/'+mx:'－'}</var></div>`;
function render(){
  if(G.mode==='create'){createView();return tx(document.getElementById('app'))}
  render0();tx(document.getElementById('app'));const tm=typeLog();save();setBgm(G.mode==='over'?'':G.mode==='battle'?'battle':'field');
  clearTimeout(AT);
  if(G.mode==='battle'&&G.auto&&!G.pending)AT=setTimeout(autoRound,800+tm);
}
function autoRound(){
  if(G.mode!=='battle'||!G.auto)return;
  const live=()=>G.enemies.map((e,i)=>[e,i]).filter(([e])=>e.hp>0);
  const pick=()=>live().sort((a,b)=>a[0].hp-b[0].hp)[0][1];
  const al=G.party.map((p,i)=>[p,i]).filter(([p])=>p.hp>0);
  const weak=al.slice().sort((a,b)=>a[0].hp/a[0].max-b[0].hp/b[0].max)[0],r=weak[0].hp/weak[0].max;
  let herb=G.herb;G.actions=[];
  for(const[m,i]of al){
    let a={t:'atk',tg:pick()};
    if(m.c==='僧侶'&&m.mp>=2&&r<.5)a={t:'heal',tg:weak[1]};
    else if(m.c==='魔術師'&&m.mp>=3&&(live().length>1||G.isBoss))a={t:'fire'};
    else if(r<.3&&herb>0){a={t:'herb',tg:weak[1]};herb--}
    a.m=i;G.actions.push(a);
  }
  resolve();
}
function give(it){
  const f=it.k==='w'?'w':'ar',v=it.k==='w'?'a':'d',cur=p=>p[f]?p[f][v]:0;
  const al=G.party.filter(p=>p.hp>0).sort((a,b)=>cur(a)-cur(b))[0];
  if(al&&cur(al)<it[v]){al[f]={n:it.n,[v]:it[v]};return `${it.n}を${al.n}が装備した。`}
  G.gold+=Math.floor(it.p/2);return `${it.n}を拾ったが、売り払った。`;
}
function chest(){
  const th=G.party.some(p=>p.c==='盗賊'&&p.hp>0);let tr='';
  if(Math.random()<(th?.12:.4)){const d=10;G.party.forEach(p=>{if(p.hp>0)p.hp=Math.max(1,p.hp-d)});tr=`罠だ！毒矢が飛び出し、全員に${d}のダメージ。`}
  const g=rnd(30,60)*G.F;G.gold+=g;let s=tr+`宝箱を見つけた。${g}Gを手に入れた。`;
  if(Math.random()<.5){const n=rnd(1,2);G.herb+=n;s+=`薬草を${n}個拾った。`}
  if(Math.random()<.5){const t=Math.min(5,Math.floor((G.F-1)/2)+(Math.random()<.3?1:0));
    s+=give(Math.random()<.5?{k:'w',...WEP[t]}:{k:'a',...ARM[t]})}
  log(s);
}
function enter(f,end){
  G.F=f;G.maxF=Math.max(G.maxF,f);MAP=gen(f);[G.x,G.y]=end?MAP.d:[1,1];
  G.d=DIRS.findIndex(([a,b])=>open(G.x+a,G.y+b));see();log(f===1&&!end?'入口の街に戻った。':`地下${f}階。`);render();
}
const stairs=d=>enter(G.F+d,d<0),warp=()=>enter(G.maxF,false);
function useOrb(){if(G.orb<1){log('帰還の玉を持っていない。');return render()}G.orb--;enter(1,false)}
function menu(m){G.menu=m;render()}
function loopState(){return{...G,mode:'explore',boss:false,chests:{},seen:new Set(),F:1,maxF:1,x:1,y:1,d:2,steps:0,loop:(G.loop||0)+1,seed:Math.floor(Math.random()*1e9),menu:null,enemies:[]}}
function newLoop(){
  G=loopState();MAP=gen(1);G.d=Math.max(0,DIRS.findIndex(([a,b])=>open(1+a,1+b)));see();
  G.log=[`${G.loop+1}周目の始まり。迷宮の構造が変わり、敵も強くなった。`];render();
}
function doRename(){
  G.party.forEach((p,i)=>{const v=document.getElementById('rn'+i).value.replace(/[<>&"']/g,'').trim();if(v)p.n=v});
  G.menu=null;log('名前を変更した。');render();
}
function useHerb(i){
  const p=G.party[i];
  if(G.herb<1||p.hp<=0)log('薬草は使えない。');
  else{G.herb--;p.hp=Math.min(p.max,p.hp+30);log(`${p.n}は薬草でHP30回復した。`)}
  G.menu=null;render();
}
function buy(k,i){
  const it=k==='herb'?{p:20}:k==='orb'?{p:100}:k==='w'?{k,...WEP[i]}:{k,...ARM[i]};
  if(G.gold<it.p){log('お金が足りない。');return render()}
  if(k==='herb')G.herb++;else if(k==='orb')G.orb++;
  else{
    const f=k==='w'?'w':'ar',v=k==='w'?'a':'d';
    if(!G.party.some(p=>p.hp>0&&(p[f]?p[f][v]:0)<it[v])){log('今の装備で十分だ。');return render()}
    log(give(it));
  }
  G.gold-=it.p;render();
}
function extra(){
  const c=MAP[G.y][G.x],wide='class="main" style="width:100%;margin-bottom:6px"';let h='';
  if(G.F===1&&c==='S')h+=`<div class="row"><button onclick="rest()">宿で休む（10G）</button><button onclick="revive()">蘇生する（80G）</button><button onclick="menu('shop')">店</button>${G.maxF>1?`<button onclick="warp()">最深階へ（地下${G.maxF}階）</button>`:''}</div>`;
  if(c==='S'&&G.F>1)h+=`<button ${wide} onclick="stairs(-1)">階段を上る</button>`;
  if(c==='D')h+=`<button ${wide} onclick="stairs(1)">階段を下りる</button>`;
  return h+`<div class="row"><button onclick="menu('herb')">薬草（${G.herb}）</button><button onclick="useOrb()">帰還の玉（${G.orb}）</button><button onclick="menu('rename')">名前変更</button></div>`;
}
function menuView(){
  const back='<button style="width:100%" onclick="menu(null)">戻る</button>';
  if(G.menu==='rename')return `<p class="who">名前を変更（6文字まで）</p>${G.party.map((p,i)=>`<div class="row"><input id="rn${i}" value="${p.n}" maxlength="6" aria-label="${p.c}の名前"></div>`).join('')}<button class="main" style="width:100%;margin-bottom:6px" onclick="doRename()">決定</button>${back}`;
  if(G.menu==='herb')return `<p class="who">薬草（${G.herb}）を誰に使う？</p><div class="row">${G.party.map((p,i)=>`<button onclick="useHerb(${i})">${p.n}（${p.hp}/${p.max}）</button>`).join('')}</div>${back}`;
  return `<p class="who">店　所持金 ${G.gold}G</p><div class="row"><button onclick="buy('herb')">薬草 20G</button><button onclick="buy('orb')">帰還の玉 100G</button>${WEP.map((w,i)=>`<button onclick="buy('w',${i})">${w.n} 攻+${w.a}　${w.p}G</button>`).join('')}${ARM.map((a,i)=>`<button onclick="buy('a',${i})">${a.n} 防+${a.d}　${a.p}G</button>`).join('')}</div>${back}`;
}
function go(k){
  const[dx,dy]=DIRS[(G.d+k)%4],nx=G.x+dx,ny=G.y+dy;
  if(!open(nx,ny)){log('石壁に阻まれた。');return render()}
  G.x=nx;G.y=ny;G.steps++;see();

function trT(t,lg){
